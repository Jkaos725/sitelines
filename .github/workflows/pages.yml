name: demo

# Publishes the hosted demo (scripts/build-demo.mjs) to GitHub Pages: a static
# copy of the viewer holding a scan of the bundled example site. One-time setup:
# repo Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - 'scripts/**'
      - 'examples/demo-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish; queue at most one behind it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # no setup-node: the build is one zero-dependency script against Node's
      # standard library, and every runner image ships a Node newer than the 18
      # sitelines needs. One less action to keep off a deprecated runtime.
      - uses: actions/checkout@v7
      - run: node scripts/build-demo.mjs --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
